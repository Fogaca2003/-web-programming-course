<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <form >
        email: <br>
        <input type="text" name="email" placeholder="Digite seu Email" value="Teste"><br>
        Senha: <br>
        <input type="password" name="senha" placeholder="Digite sua Senha"><br>
        
        Comentário: <br>
        <textarea name="comentario" placeholder="Digite seu Comentário"></textarea><br>


        <button type="submit" value="Entrar"><img src="submit.png" alt="Entrar"></button>
        <button type="reset">Limpar</button>

    </form>

    <form action="" method="get">
        <h2> Label </h2>

        <!-- 
        Label é um elemento HTML usado para associar um rótulo 
        a um campo de formulário, como um campo de entrada (input), 
        uma caixa de seleção (checkbox) ou um botão de opção (radio button). 
        O elemento label é importante para melhorar a acessibilidade e a 
        usabilidade dos formulários, pois permite 
        que os usuários entendam claramente o 
        propósito de cada campo.
        -->
        <label>
            Nome:
            <input type="text" name="nome">
        </label>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email">
        
        <br>

        <h2> Mais elementos de formulário </h2>

        Gênero: <br>
        <input type="radio" name="genero" value="masculino" id="masculino">
        <label for="masculino">Masculino</label>

        <input type="radio" name="genero" value="feminino" id="feminino">
        <label for="feminino">Feminino</label>

        <input type="radio" name="genero" value="outro" id="outro">
        <label for="outro">Outro</label> <br>
      
        <br>

        <input type="radio" name="tipo" value="Web"> Web <br>
        <input type="radio" name="tipo" value="Mobile"> Mobile <br>

        <br>
        <br>
        Estilo Musical: <br>
        <input type="checkbox" name="estilo" value="rock" id="rock">
        <label for="rock">Rock</label>
        <input type="checkbox" name="estilo" value="pop" id="pop">
        <label for="pop">Pop</label>
        <input type="checkbox" name="estilo" value="jazz" id="jazz">
        <label for="jazz">Jazz</label>
        <input type="checkbox" name="estilo" value="classica" id="classica">
        <label for="classica">Clássica</label>

        <br>
        <br>

        Caixa de seleção: <br>
        <select name="pais">
            <option value="">Selecione um país</option>
            <option value="brasil">Brasil</option>
            <option value="estados-unidos">Estados Unidos</option>
            <option value="canada">Canadá</option>
            <option value="reino-unido">Reino Unido</option>
        </select>

        <br>
        <br>

        Upload de arquivo: <br>
        <input type="file" name="arquivo">
        <br>
        <br>


        <input type="submit" value="Cadastrar">
    </form>

    <form>

        <h2>fieldset e legend  </h2>

        <!--
        O elemento fieldset é usado para agrupar elementos relacionados em um formulário.
        Atributos:
        - legend: Define o título do grupo de elementos.
        -->
        <fieldset>
            <legend>Informações Pessoais</legend>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome">
            <label for="email2">Email:</label>
            <input type="email" name="email" id="email2">
            <label for="idade">Idade:</label>
            <input type="number" name="idade" id="idade"><br>
        </fieldset>
        
        <fieldset>
            <legend>Dados Adicionais</legend>
            <label for="genero2">Gênero:</label>
            <input type="radio" name="genero" value="masculino" id="masculino2">
            <label for="masculino2">Masculino</label>
            <input type="radio" name="genero" value="feminino" id="feminino2">
            <label for="feminino2">Feminino</label>
            <input type="radio" name="genero" value="outro" id="outro2">
            <label for="outro2">Outro</label> <br>
        </fieldset>

    </form>

    <!-- Formulario de contacto 
     form - > (formulario)
     input - > (campo de entrada)
     submit - > (enviar)
     type="text" -> (tipo de campo de entrada, neste caso, um campo de texto)
     type="password" -> (tipo de campo de entrada, neste caso, um campo de senha, onde os caracteres digitados são ocultados)
     textarea - > (campo de texto multilinha, usado para comentários ou mensagens mais longas)      
     button - > (botão)
     button type="submit" -> (botão que, quando clicado, envia os dados do formulário para o servidor)  
     button value="Entrar" -> (valor que será enviado para o servidor quando o botão for clicado, neste caso, "Entrar")     
     button type="submit" value="Entrar" -> (botão que, quando clicado, envia os dados do formulário para o servidor, e o valor "Entrar" é enviado junto com os dados do formulário)
     button reset -> (botão que, quando clicado, limpa todos os campos do formulário, resetando-os para seus valores iniciais)
     method="get" -> (método de envio dos dados, os dados ficam visíveis na URL)
     method="post" -> (método de envio dos dados, os dados ficam ocultos na URL)
     action="processa" -> (destino para onde os dados serão enviados para processamento)
     name="email" -> (atributo que identifica o campo de entrada, usado para acessar os dados no servidor)
     placeholder="Digite seu Email" -> (texto de dica que aparece dentro do campo de entrada, indicando o que deve ser digitado)        
    
    -->
</body>
</html>
