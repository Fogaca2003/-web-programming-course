<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caracteres Especiais</title>
</head>
<body>
    <h1>Caracteres Especiais</h1>

    <!-- 
    Caracteres especiais são símbolos ou caracteres que têm um significado específico em HTML e não podem ser usados diretamente no código sem serem interpretados como parte da estrutura do documento. Para usar esses caracteres, é necessário usar entidades HTML, que são representações de caracteres especiais usando uma combinação de caracteres alfanuméricos e símbolos.

-->
    <p>Exemplos de caracteres especiais e suas entidades HTML:</p>
    <ul>
        <li>&amp; - &</li>
        <li>&lt; - <</li>
        <li>&gt; - ></li>
        <li>&quot; - "</li>
        <li>&#39; - '</li>
        <li>&copy; - ©</li>
        <li>&reg; - ®</li>
        <li>&euro; - €</li>
    </ul>

    <p> Emoções: 😊 😢 😡</p>
    
    <h2> Exercício </h2>

    &lt;h1&gt; Sebastião &amp; co - &sum; &lt;h1&gt; <br>
    &euro; 2.59 <br>
    &copy; Todos os direitos reservados 
</body>
</html>
