<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatacao de texto</title>
</head>
<body>
    
    <!-- 
    <b>Negrito</b> representa um texto em negrito, usado para destacar palavras ou frases importantes.
    <u>Sublinhado</u>
    <strong>Negrito</strong> representa um texto em negrito, usado para destacar palavras ou frases importantes, com ênfase adicional.
    <em>Itálico</em>
    <mark>Marca texto</mark>
    -->

    <h2>Formatacao de texto</h2>
    Esse é um texto <b>negrito</b> <br>
    Esse é um texto <strong>Importante</strong> <br>
    Esse é um texto <i>Itálico</i> <br>
    Esse é um texto <em>Enfatizado</em> <br>
    Esse é um texto <mark>Marcado</mark> <br>

    <!--
    <u>Sublinhado</u> representa um texto sublinhado, usado para destacar palavras ou frases, embora seja menos comum em HTML moderno devido a possíveis confusões com links.
    <del>Riscado</del> representa um texto riscado, usado para indicar que algo foi removido ou é incorreto.
    -->
    Esse é um texto <u>Sublinhado</u> <br>
    Esse é um texto <del>Riscado</del> <br>

    <!--
    <sup>Superscript</sup> representa um texto em sobrescrito, usado para indicar expoentes ou notas de rodapé.
    <sub>Subscript</sub> representa um texto em subscrito, usado para indicar
    -->

    <h2> Diferentes tipos de Caracteres </h2>
    Esse é um texto <sup>Superscript</sup> <br>
    Esse é um texto <sub>Subscript</sub> <br>


</body>
</html>
