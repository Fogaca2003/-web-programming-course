<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>

    <h1>Imagens</h1>

    <!--
        img = tag para inserir imagens
        src = atributo para indicar o caminho da imagem
        alt = atributo para indicar um texto alternativo para a imagem, caso ela não seja carregada
        tipo de imagem = jpg, png, gif, webp, svg, etc.
        width = atributo para indicar a largura da imagem
        hight = atributo para indicar a altura da imagem
        style = atributo para indicar estilos CSS para a imagem
        background-image = propriedade CSS para indicar uma imagem de fundo para um elemento
        background-color = propriedade CSS para indicar a cor de fundo para um elemento
           
        -->

    <img src="/05_imagens/praia.jpg.webp"
        alt="Praia" width="500">
    
</body>
</html>
