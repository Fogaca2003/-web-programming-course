<!DOCTYPE html>

    <title>Cabecalhos</title>
</head>
<body>

    <h1>Titulo 1</h1> <!-- H1, cabeçalho de nível 1 -->
    <h2>Titulo 2</h2> <!-- H2, cabeçalho de nível 2 -->
    <h3>Titulo 3</h3> <!-- H3, cabeçalho de nível 3 -->
    <h4>Titulo 4</h4> <!-- H4, cabeçalho de nível 4 -->
    <h5>Titulo 5</h5> <!-- H5, cabeçalho de nível 5 -->
    <h6>Titulo 6</h6> <!-- H6, cabeçalho de nível 6 -->

    <p>Parágrafo, texto normal...</p> <!-- P, parágrafo -->

    <br> <!-- Quebra de linha -->
    
    Essa é uma empresa tal...
    
</body>
</html>
